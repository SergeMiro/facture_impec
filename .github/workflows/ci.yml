name: CI

# Note (2026-10-17): GitHub Actions is disabled on this account (billing), so this
# workflow does not run. The same gate runs locally: `pnpm verify` (docs/RUNBOOK.md).

on:
  push:
    branches: [dev, preprod, prod]
  pull_request:

jobs:
  verify:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
