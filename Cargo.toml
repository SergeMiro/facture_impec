[workspace]
resolver = "2"
members = [
    "crates/facture-core",
    "crates/facture-wasm",
    # Ajouté en Phase 3 (cf. AGENT_PLAN.md §11) :
    #   "crates/facture-backend"  — Axum
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Sergiy Mirochnyk <mirochnyk.sergiy@gmail.com>"]
repository = "https://github.com/SergeMiro/facture_impec"
description = "Assistant de pré-vol pour la facturation électronique française (EN 16931)."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"

[profile.release]
opt-level = "s"   # taille réduite — important pour le WASM chargé dans le task pane
lto = true
