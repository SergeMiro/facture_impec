# The pilot stack (docs/DEPLOY.md): the API with its workers, and Postgres. Settings and secrets come
# from deploy/.env (never committed, chmod 600). Put a TLS reverse proxy in front of 127.0.0.1:4000:
# Office, Stripe's webhooks and B2Brouter's need https.
name: facture-impec
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: fi
      POSTGRES_DB: fi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fi -d fi']
      interval: 5s
      retries: 30
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://fi:${POSTGRES_PASSWORD}@postgres:5432/fi
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:${API_PUBLISHED_PORT:-4000}:4000
    # One JSON line per event (docs/DEPLOY.md § 7): kept, but not until the disk is full.
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '5' }
    restart: unless-stopped

  # ── `--profile observability` (docs/DEPLOY.md § 7): metrics, alerts by e-mail, a dashboard ─────
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    secrets: [metrics_token]
    depends_on: [api]
    ports:
      - 127.0.0.1:${PROMETHEUS_PUBLISHED_PORT:-9090}:9090
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: [observability]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager
    secrets: [alert_smtp_password]
    ports:
      - 127.0.0.1:${ALERTMANAGER_PUBLISHED_PORT:-9093}:9093
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.3
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/facture-impec.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    secrets: [grafana_admin_password]
    depends_on: [prometheus]
    ports:
      - 127.0.0.1:${GRAFANA_PUBLISHED_PORT:-3001}:3000
    restart: unless-stopped

# From deploy/.env; only the observability profile reads them.
secrets:
  metrics_token:
    environment: METRICS_TOKEN
  alert_smtp_password:
    environment: ALERT_SMTP_PASSWORD
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD
volumes:
  pgdata: {}
  promdata: {}
  alertdata: {}
  grafanadata: {}
